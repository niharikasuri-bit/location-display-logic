<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Display Logic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="display-logic.css?v=3" />
</head>
<body>
  <main class="page">
    <h1 class="page-title">Display Logic</h1>
    <div class="demo-box" id="dl-host"></div>
  </main>

  <dialog class="modal dlg-logic" id="logic-dialog" aria-labelledby="lg-title">
    <form id="lg-form" novalidate>
      <div class="lg-head">
        <h2 class="lg-title" id="lg-title"><span class="lg-ico" id="lg-ico"></span>Display Logic</h2>
        <button type="button" class="icon-btn" id="lg-close" data-close aria-label="Close"></button>
      </div>
      <div class="lg-body" id="lg-body"></div>
      <div class="lg-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <div class="sr-only" id="live" aria-live="polite"></div>
  <script src="display-logic.js?v=5"></script>
</body>
</html>
